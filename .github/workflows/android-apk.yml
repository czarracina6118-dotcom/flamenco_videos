name: Generar APK de vídeos

on:
  workflow_dispatch:
  push:
    branches: [main, codex/android-apk]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar herramientas Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar y revisar
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug testDebugUnitTest
      - name: Preparar vídeo de prueba
        run: |
          python3 - <<'PYCODE'
          import base64
          from pathlib import Path
          out = Path('android/app/src/androidTest/assets/playback-smoke.mp4')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(base64.b64decode(Path('android/playback-smoke.b64').read_text().strip(), validate=True))
          PYCODE
      - name: Permitir aceleración del emulador
        run: sudo chmod 666 /dev/kvm
      - name: Probar reproducción y salto en Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle -p android --no-daemon connectedDebugAndroidTest
      - name: Preparar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Videos-Flamencos-1.1-prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Videos-Flamencos-APK
          path: Videos-Flamencos-1.1-prueba.apk
          if-no-files-found: error
          retention-days: 30
